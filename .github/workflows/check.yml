name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm install --no-save --package-lock=false @openai/codex@0.165.0 chrome-devtools-mcp@1.12.0
      - run: npm run test:codex-contract
        env:
          WJ_CODEX_BINARY: ./node_modules/.bin/codex
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          WJ_TEST_CHROME_MCP: ./node_modules/.bin/chrome-devtools-mcp
